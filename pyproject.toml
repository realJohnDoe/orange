[project]
name = "dep-structure-linter"
version = "0.1.0"
description = "Phase 0 measurement pipeline: dependency-graph cost metrics over a corpus of repos"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "scipy>=1.15.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
