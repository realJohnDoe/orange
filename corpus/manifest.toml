# Phase 0 corpus manifest.
#
# Every repo pins a commit sha -- re-extraction must be reproducible, and
# "current main" is a moving target that would silently invalidate every
# cached graph in corpus/graphs/. Re-pin deliberately, not by accident.
#
# stage:   which build-order stage (see the Phase 0 plan) first analyzes
#          this repo. Omitted for disabled entries.
# roots:   source directories analyzed, relative to the repo root. Verified
#          against each repo's actual layout at the pinned commit via the
#          GitHub contents API, not guessed -- several differ from what
#          plan.md assumed (requests and date-fns have both moved to
#          different layouts since the corpus was chosen).
# enabled: false entries are skipped by corpus/sync.py and the extractors;
#          `note` records why.
# exclude: extra --exclude/--ignore glob patterns for report/run.py, for a
#          repo whose tests/generated files don't follow the default naming
#          conventions (extractors.classify.DEFAULT_TEST_EXCLUDES /
#          DEFAULT_GENERATED_EXCLUDES). Not used by sync.py. Omitted where
#          the defaults are sufficient.

